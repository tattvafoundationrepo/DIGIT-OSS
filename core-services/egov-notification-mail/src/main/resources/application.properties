# server.port=8089

# =============================================================================
# KAFKA CONFIGURATION
# =============================================================================
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.listener.auto-startup=true
kafka.topics.notification.mail.name=egov.core.notification.email
kafka.topics.notification.sms.topic.name=egov.core.notification.sms

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.egov.tracer.kafka.deserializer.HashMapDeserializer
spring.kafka.consumer.group-id=email_group1
spring.kafka.listener.missing-topics-fatal=false
spring.kafka.consumer.properties.spring.json.use.type.headers=false


# THIS IS THE MOST IMPORTANT SETTING - The FROM address
mail.from=noreplybmc@email.mcgm.gov.in


#Email Configuration
mail.enabled=true
# mail.sender.username=md@email.mcgm.gov.in
# mail.sender.password=lmfq_!2435
# To use environment variables:
mail.sender.username=${MAIL_SENDER_USERNAME:md@email.mcgm.gov.in}
mail.sender.password=${MAIL_SENDER_PASSWORD:lmfq_!2435}
mail.host=${MAIL_HOST:newmdspl-mst.qlc.co.in}
mail.port=${MAIL_PORT:587}
mail.smtp.auth=true
mail.smtp.starttls.enable=true
mail.smtp.debug=false
# mail.port=587
# mail.host=newmdspl-mst.qlc.co.in
mail.protocol=smtp


# Default Subject
email.subject=Egovernments Notification

# =============================================================================
# Localization
# =============================================================================
egov.localization.host=https://dev.digit.org
egov.localization.workDir.path=/localization/messages/v1
egov.localization.context.path=/localization/messages/v1
egov.localization.search.endpoint=/_search
egov.localization.statelevel=true
egov.localization.default.locale=en_IN

# =============================================================================
# User Config
# =============================================================================
egov.user.host=http://bmc-dev.tattvafoundation.org
egov.user.context.path=/user
egov.user.search.endpoint=/_search
egov.user.state.tenant.id=mh.mumbai

# =============================================================================
# DEBUG LOGGING (Enable for troubleshooting)
# =============================================================================
logging.level.org.springframework.mail=DEBUG
logging.level.org.egov.web.notification=DEBUG
logging.level.javax.mail=DEBUG
logging.level.org.springframework.kafka=DEBUG

# Increase max file size for attachments
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
